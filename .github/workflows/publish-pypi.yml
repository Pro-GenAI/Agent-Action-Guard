name: Publish Python Package to PyPI when a Release is Created

on:
  release:
    types: [created]

jobs:
  validate:
    name: Validate release source before publication
    uses: ./.github/workflows/security-audit.yml
    permissions:
      contents: read

  publish-pypi:
    name: Publish release to PyPI
    runs-on: ubuntu-latest
    needs: validate
    environment:
      name: pypi
      url: https://pypi.org/p/agent-action-guard

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine # check-manifest

      # - name: Check manifest
      #   working-directory: python
      #   run: check-manifest

      - name: Build package
        working-directory: python
        run: python -m build

      - name: Check distributions
        working-directory: python
        run: twine check dist/*

      - name: Test built wheel in clean environment
        working-directory: python
        run: |
          python -m venv /tmp/pkg-test
          /tmp/pkg-test/bin/python -m pip install --upgrade pip
          /tmp/pkg-test/bin/python -m pip install dist/*.whl
          /tmp/pkg-test/bin/python -m pip install pytest rich
          cd /tmp
          /tmp/pkg-test/bin/python -m pytest "$GITHUB_WORKSPACE/python/tests"

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e # pypa/gh-action-pypi-publish@v1.13.0
        with:
          packages-dir: python/dist
          verbose: true
